# LazyGit custom configuration matching DESIGN.md styling
gui:
  theme:
    activeBorderColor:
      - '#41a1cf' # Signal Blue
      - bold
    inactiveBorderColor:
      - '#dee2de' # Mist border
    searchingActiveBorderColor:
      - '#0081c0' # Cerulean / primary-dark
      - bold
    optionsTextColor:
      - '#0081c0' # Cerulean / primary-dark
    selectedLineBgColor:
      - '#f9faf7' # Linen surface wash
    cherryPickedCommitBgColor:
      - '#f9faf7' # Linen surface wash
    cherryPickedCommitFgColor:
      - '#41a1cf' # Signal Blue
    unstagedChangesColor:
      - '#1f1f29' # Dusk / Danger

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
