# Kitty terminal configuration file (QN37x Theme & Zellij autostart)

font_family      JetBrains Mono
font_size        11.0

# Color Scheme matching DESIGN.md
background       #0C1614
foreground       #e2e2e2
selection_background #00FF8A
selection_foreground #0C1614

# Window Borders (Growth Green accent for active, Surface Dark for inactive)
active_border_color #00FF8A
inactive_border_color #0C1614

# Auto-start Zellij multiplexer on terminal launch
shell zellij

