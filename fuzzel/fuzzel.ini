[main]
# Font: set to Google Sans Flex with size 16px derived from the body-md typography token
font=Google Sans Flex:size=16
# DPI: enable display scale awareness for sharp text rendering
dpi-aware=yes
# Prompt character: set a clean search indicator symbol
prompt="❯ "
# Icons: enable application icons next to results for visual recognition
icons-enabled=yes
# Search fields: define which desktop entry fields to match query against
fields=filename,name,generic
# Window width: set the launcher window width in character cells
width=40
# Window height: set the number of visible result rows
lines=10
# Horizontal padding: set padding inside window to 24px derived from the md spacing token
horizontal-pad=24
# Vertical padding: set padding inside window to 16px derived from the sm spacing token
vertical-pad=16
# Inner padding: set vertical space between prompt and results to 8px derived from the xs spacing token
inner-pad=8

[colors]
# Background: set to surface-medium color (121F1C) with 86% opacity (DD) for modern dark-mode depth
background=121F1CDD
# Text: set to on-surface color (E2E2E2) with 100% opacity (FF) for standard result text
text=E2E2E2FF
# Prompt: set color to on-surface (E2E2E2) with 100% opacity (FF) to match default text
prompt=E2E2E2FF
# Input: set user typed text color to on-surface (E2E2E2) with 100% opacity (FF)
input=E2E2E2FF
# Matches: highlight matched characters in search results using action-cyan (00BFD6) at full opacity (FF)
match=00BFD6FF
# Selection: set active item background to growth-green (00FF8A) at full opacity (FF)
selection=00FF8AFF
# Selection Text: set active item text color to on-primary (00391A) at full opacity (FF) for high contrast readability
selection-text=00391AFF
# Selection Matches: highlight matched characters on active item using on-primary-fixed (00210D) at full opacity (FF)
selection-match=00210DFF
# Border: set window border to action-cyan (00BFD6) at full opacity (FF) for interactive focus
border=00BFD6FF

[border]
# Border width: thickness of the window border in pixels
width=2
# Border radius: set corner rounding to 16px derived from the squircle-lg token
radius=16
