[main]
# Typography: set primary display font to Google Sans Flex with size 12
font=Google Sans Flex:size=12
# Layout: enable display scale awareness for sharp text rendering
dpi-aware=yes
# Prompt: set a clean search indicator symbol
prompt="❯ "
# Icons: enable app icons next to results for visual recognition
icons-enabled=yes
# Search: define which desktop entry fields to match against
fields=filename,name,generic
# Geometry: set the window width in character cells
width=40
# Geometry: set number of visible result rows
lines=10
# Padding: horizontal padding inside the window border (px)
horizontal-pad=24
# Padding: vertical padding inside the window border (px)
vertical-pad=16
# Padding: vertical space between prompt and result list (px)
inner-pad=10

[colors]
# Background: ink color with 86% opacity (0B0B0Cdd) for readability
background=0B0B0Cdd
# Text: paper color (F0F5F5FF) for standard query and result text
text=F0F5F5FF
# Prompt: paper color (F0F5F5FF) to match standard text styling
prompt=F0F5F5FF
# Input: paper color (F0F5F5FF) for user-entered text
input=F0F5F5FF
# Matches: highlighted using alert yellow (FFDB13FF) for readability
match=FFDB13FF
# Selection: background color set to primary accent blue (0053D6FF)
selection=0053D6FF
# Selection Text: paper color (F0F5F5FF) for active item text
selection-text=F0F5F5FF
# Selection Matches: highlighted using alert yellow (FFDB13FF) on selected item
selection-match=FFDB13FF
# Border: secondary accent purple color (A261FFFF) around window
border=A261FFFF

[border]
# Border: thickness of the window border in pixels
width=2
# Radius: rounded corners set to radius_sm (12px) from DESIGN.md
radius=12
