# theme.toml - Color scheme and style customization for Yazi file manager
# Strictly derived from the QN37x design system (DESIGN.md)

[app]
# Uses on-surface (#e2e2e2) for text and Floor Level 0 (#0C1614) for background
overall = { fg = "#e2e2e2", bg = "#0C1614" }

[manager]
# Highlights current directory in action-cyan (#00BFD6)
cwd = { fg = "#00BFD6", bold = true }

# Character used to draw separation borders
border_symbol = "│"

# Layout borders use outline-variant (#3b4b3d) for a subtle ghost-border look
border_style = { fg = "#3b4b3d" }

# Copy badge uses primary growth-green (#00FF8A)
marker_copied   = { fg = "#00FF8A", bg = "#00FF8A" }
# Cut badge uses error red (#ffb4ab) to indicate warning/removal state
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
# Marked badge uses action-cyan (#00BFD6) for active selection
marker_marked   = { fg = "#00BFD6", bg = "#00BFD6" }
# Multi-select badge uses secondary-fixed-dim (#41d8f0)
marker_selected = { fg = "#41d8f0", bg = "#41d8f0" }

# Copied count badge uses growth-green (#00FF8A) text on dark floor (#0C1614)
count_copied   = { fg = "#00FF8A", bg = "#0C1614" }
# Cut count badge uses error red (#ffb4ab) text on dark floor (#0C1614)
count_cut      = { fg = "#ffb4ab", bg = "#0C1614" }
# Selected count badge uses secondary-fixed-dim (#41d8f0) text on dark floor (#0C1614)
count_selected = { fg = "#41d8f0", bg = "#0C1614" }

[indicator]
# Active cursor uses growth-green (#00FF8A) background and dark text (#0C1614) for focus
current = { fg = "#0C1614", bg = "#00FF8A", bold = true }

# Parent cursor uses action-cyan (#00BFD6) background and dark text (#0C1614)
parent  = { fg = "#0C1614", bg = "#00BFD6" }

# Underlines the cursor position in the preview pane
preview = { underline = true }

[status]
# Status line sits on Surface Level 1 (#121F1C) with on-surface (#e2e2e2) text
overall = { fg = "#e2e2e2", bg = "#121F1C" }

# Normal mode indicator uses growth-green (#00FF8A) for default command state
mode_normal = { fg = "#0C1614", bg = "#00FF8A", bold = true }

# Select mode indicator uses action-cyan (#00BFD6) for interactive selection
mode_select = { fg = "#0C1614", bg = "#00BFD6", bold = true }

# Unset/other modes use error red (#ffb4ab) as alert state
mode_unset  = { fg = "#0C1614", bg = "#ffb4ab", bold = true }

# Progress labels use bold on-surface (#e2e2e2) text
progress_label  = { fg = "#e2e2e2", bold = true }
# Active progress bar uses growth-green (#00FF8A) on surface-medium (#121F1C) track
progress_normal = { fg = "#00FF8A", bg = "#121F1C" }
# Error progress bar uses error red (#ffb4ab) on error-container (#93000a) track
progress_error  = { fg = "#ffb4ab", bg = "#93000a" }

# Permission separators use outline-variant (#3b4b3d)
perm_sep  = { fg = "#3b4b3d" }
# Permission directory indicator uses action-cyan (#00BFD6)
perm_type = { fg = "#00BFD6" }
# Read permissions use on-surface-variant (#b9cbb9)
perm_read = { fg = "#b9cbb9" }
# Write permissions use error red (#ffb4ab)
perm_write= { fg = "#ffb4ab" }
# Execute permissions use growth-green (#00FF8A)
perm_exec = { fg = "#00FF8A" }

[input]
# Focused input border glows with action-cyan (#00BFD6)
border   = { fg = "#00BFD6" }
title    = {}
value    = {}
# Text selection in inputs uses a dim cyan (#004952)
selected = { bg = "#004952" }

[pick]
# Dropdowns use outline-variant (#3b4b3d) for standard borders
border   = { fg = "#3b4b3d" }
# Active items in dropdown lists use growth-green (#00FF8A)
active   = { fg = "#00FF8A", bold = true }
inactive = {}

[completion]
# Autocomplete popup borders use outline (#849585) for distinction
border   = { fg = "#849585" }
# Active autocomplete selection uses growth-green (#00FF8A) on surface-medium (#121F1C)
active   = { fg = "#00FF8A", bg = "#121F1C", bold = true }
inactive = {}

[tasks]
# Task list borders use outline-variant (#3b4b3d)
border = { fg = "#3b4b3d" }
# Task list title uses bold on-surface (#e2e2e2)
title  = { fg = "#e2e2e2", bold = true }
# Hovering a task uses growth-green (#00FF8A) background
hover  = { fg = "#0C1614", bg = "#00FF8A" }

[which]
# Key chord panel uses Floor Level 0 (#0C1614) background
mask = { bg = "#0C1614" }
# Key candidates use growth-green (#00FF8A)
cand = { fg = "#00FF8A" }
# Remaining keys in layout use on-surface-variant (#b9cbb9)
rest = { fg = "#b9cbb9" }
# Descriptions use secondary cyan (#45dbf3)
desc = { fg = "#45dbf3" }
# Separator string between key and description
separator = " ➔ "
# Separator style uses outline (#849585)
separator_style = { fg = "#849585" }

[help]
# Help keys use growth-green (#00FF8A)
on   = { fg = "#00FF8A" }
# Help execution command uses action-cyan (#00BFD6)
run  = { fg = "#00BFD6" }
# Help descriptions use on-surface (#e2e2e2)
desc = { fg = "#e2e2e2" }
# Hovering a help item highlights in growth-green (#00FF8A)
hover = { fg = "#0C1614", bg = "#00FF8A" }

[filetype]
# Defines syntax highlighting styles based on file extensions or mime-types
rules = [
  # Directories use action-cyan (#00BFD6) and bold formatting
  { url = "*/", fg = "#00BFD6", bold = true },
  
  # Media files use secondary-fixed-dim (#41d8f0)
  { mime = "image/*", fg = "#41d8f0" },
  { mime = "video/*", fg = "#41d8f0" },
  { mime = "audio/*", fg = "#41d8f0" },
  
  # Archives and compressed files use primary-fixed-dim green (#00e47a)
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#00e47a" },
  
  # Text files use standard on-surface (#e2e2e2)
  { mime = "text/*", fg = "#e2e2e2" },
  
  # Documents/PDFs use tertiary-fixed-dim (#bbcac5)
  { mime = "application/{pdf,epub+zip,postscript,x-shockwave-flash}", fg = "#bbcac5" },

  # Fallback for all other files uses on-surface (#e2e2e2)
  { mime = "*", fg = "#e2e2e2" }
]
