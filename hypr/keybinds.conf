# Keybindings configuration for Hyprland

$mainMod = SUPER # Set the main modifier key to SUPER

# Application Launchers
bind = $mainMod, RETURN, exec, kitty # Open kitty terminal emulator
bind = $mainMod, d, exec, fuzzel # Launch Fuzzel application launcher
bind = $mainMod, e, exec, kitty -e yazi # Launch Yazi file manager inside kitty

# Window Management Binds
bind = $mainMod, q, killactive, # Close/kill the active window
bind = $mainMod, c, killactive, # Close/kill the active window (alternative)
bind = $mainMod, f, fullscreen, # Toggle fullscreen state for the active window
bind = $mainMod, v, togglefloating, # Toggle floating/tiling state for the active window
bind = $mainMod, s, togglesplit, # Toggle window split direction (dwindle layout)

# Focus Directional (Vim-style)
bind = $mainMod, h, movefocus, l # Move focus to the left window
bind = $mainMod, j, movefocus, d # Move focus to the bottom window
bind = $mainMod, k, movefocus, u # Move focus to the top window
bind = $mainMod, l, movefocus, r # Move focus to the right window

# Focus Cycling (Alt-Tab style)
bind = $mainMod, TAB, cyclenext, # Cycle focus to the next window
bind = $mainMod SHIFT, TAB, cyclenext, prev # Cycle focus to the previous window

# Workspace Navigation (Limited to workspaces 1-5)
bind = $mainMod, 1, workspace, 1 # Switch focus to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch focus to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch focus to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch focus to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch focus to workspace 5

# Move Active Window to Workspaces (Limited to workspaces 1-5)
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move focused window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move focused window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move focused window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move focused window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move focused window to workspace 5

# Previous/Current Workspace Toggle
bind = $mainMod, grave, workspace, previous # Toggle between current and last active workspace

# Resize Submap (SUPER+r)
bind = $mainMod, r, submap, resize # Enter window resize submap mode
submap = resize # Start definition of the resize submap
binde = , h, resizeactive, -10 0 # Shrink the active window horizontally
binde = , l, resizeactive, 10 0 # Expand the active window horizontally
binde = , k, resizeactive, 0 -10 # Shrink the active window vertically
binde = , j, resizeactive, 0 10 # Expand the active window vertically
bind = , escape, submap, reset # Exit resize submap and restore default mode
bind = , enter, submap, reset # Exit resize submap and restore default mode
submap = reset # Reset to the default submap context

# Screenshots (grim + slurp)
bind = , Print, exec, grim ~/Pictures/$(date +'%Y%m%d_%H%M%S_screenshot.png') # Capture full screen to files
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy # Capture regional screenshot to clipboard
bind = $mainMod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy # Capture regional screenshot to clipboard (alternative)

# System Controls
bind = $mainMod, Escape, exec, hyprlock # Lock screen using hyprlock utility
bind = $mainMod SHIFT, Q, exit, # Exit Hyprland and terminate user session

# Mouse Bindings for Resizing/Moving
bindm = $mainMod, mouse:272, movewindow # Drag with mouse left click to move window
bindm = $mainMod, mouse:273, resizewindow # Drag with mouse right click to resize window
