# Window rules configuration for Hyprland

# Float rules for standard utility and dialog windows
windowrulev2 = float, class:^(confirm)$ # Float confirmation dialogs
windowrulev2 = float, class:^(dialog)$ # Float utility dialog windows
windowrulev2 = float, class:^(download)$ # Float download manager windows
windowrulev2 = float, class:^(notification)$ # Float system notification overlays
windowrulev2 = float, class:^(error)$ # Float application error windows
windowrulev2 = float, class:^(splash)$ # Float splash screen windows
windowrulev2 = float, class:^(confirmreset)$ # Float reset prompt screens
windowrulev2 = float, class:^(org.gnome.Calculator)$ # Float GNOME calculator utility
windowrulev2 = float, class:^(file_progress)$ # Float file progress indicators
