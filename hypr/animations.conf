# Animations configuration for Hyprland

animations {
    enabled = true # Enable animations globally

    # Custom Bezier deceleration curves for premium UI feel
    bezier = fluent_curve, 0.16, 1, 0.3, 1 # Fluent-like deceleration curve
    bezier = easeInOut, 0.42, 0, 0.58, 1 # Standard ease-in-out curve

    # Window animation settings
    animation = windows, 1, 4, fluent_curve, slide # Slide in/out windows smoothly
    animation = windowsIn, 1, 4, fluent_curve, slide # Slide in when opening new windows
    animation = windowsOut, 1, 4, fluent_curve, slide # Slide out when closing windows
    
    # Border transitions
    animation = border, 1, 6, easeInOut # Cross-fade active and inactive borders
    
    # Fade effects
    animation = fade, 1, 4, easeInOut # Fade transition for opacity changes
    
    # Workspace transitions
    animation = workspaces, 1, 5, fluent_curve, slide # Slide animation when switching workspaces
}
